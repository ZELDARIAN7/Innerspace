<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inner Space — a quiet place, in your pocket</title>
<meta name="description" content="Stories you walk into, a cave with ten levels, rituals for the heart, real instruments, a voice that listens. Hand-drawn, English and Arabic, nothing recorded.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#07060c">
<style>
:root{--bg:#07060c;--ink:#f3efe6;--mist:rgba(235,240,238,.72);--faint:rgba(235,240,238,.45);--gold:#ecc77e;--gold2:#d9a85c;--line:rgba(255,255,255,.08);--serif:Georgia,'Times New Roman',serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow-x:hidden}
html[lang=ar] body{font-family:'Noto Naskh Arabic','Geeza Pro',Tahoma,sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 0%,rgba(140,232,198,.08),transparent 60%),radial-gradient(40% 30% at 85% 60%,rgba(236,199,126,.06),transparent 60%),radial-gradient(40% 30% at 10% 80%,rgba(185,149,255,.06),transparent 60%)}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:min(100% - 32px,1120px);margin:0 auto}
/* nav */
.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,6,12,.6);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{font-size:.72rem;letter-spacing:.42em;text-indent:.42em;line-height:1.15;color:var(--ink);font-weight:600}
html[lang=ar] .brand{letter-spacing:0;text-indent:0;font-size:.95rem}
.brand small{display:block;font-size:.5rem;letter-spacing:.3em;color:var(--faint)}
html[lang=ar] .brand small{letter-spacing:0;font-size:.7rem}
.nav .sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:8px 14px;font-size:.78rem;color:var(--mist)}
.lang button.on{background:rgba(236,199,126,.16);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:linear-gradient(135deg,#ffe8b0,#ecc77e 55%,#e0b060);color:#1a1206;font-weight:800;font-size:.84rem;letter-spacing:.06em;border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(236,199,126,.32);transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(236,199,126,.42)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line);box-shadow:none}
/* hero */
.hero{padding:clamp(40px,8vh,90px) 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.k{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700}
html[lang=ar] .k{letter-spacing:0;font-size:.85rem;text-transform:none}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,5.2vw,4.2rem);line-height:1.08;margin:14px 0 18px;letter-spacing:-.01em}
html[lang=ar] h1{font-family:'Noto Naskh Arabic','Geeza Pro',serif;line-height:1.35}
.lede{color:var(--mist);font-size:clamp(1rem,1.3vw,1.15rem);max-width:56ch;margin:0 0 26px}
.cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cta small{color:var(--faint);font-size:.78rem}
.phones{position:relative;height:clamp(560px,50vw,700px)}
.phone{position:absolute;width:clamp(160px,19vw,230px);border-radius:28px;padding:6px;background:#0d0b14;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(140,232,198,.08);overflow:hidden}
.phone img{border-radius:22px;width:100%}
.phone.a{left:6%;top:4%;transform:rotate(-7deg);z-index:2}
.phone.b{right:8%;top:14%;transform:rotate(6deg)}
.phone.c{left:36%;top:28%;transform:rotate(-1deg);z-index:3}
/* stats */
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:10px 0 60px}
.stat{padding:18px 10px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:2rem;line-height:1;color:#fff;font-weight:400}
.stat span{font-size:.72rem;color:var(--faint);letter-spacing:.04em}
/* sections */
section{padding:48px 0}
.head{max-width:60ch;margin-bottom:26px}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.15;margin:10px 0 10px}
html[lang=ar] h2{font-family:'Noto Naskh Arabic','Geeza Pro',serif;line-height:1.4}
.head p{color:var(--mist);margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
/* doors mock */
.orbwrap{position:relative;display:grid;place-items:center;padding:30px 0 60px}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eafff6,#8ff0cf 22%,#1d7a66 58%,#0a2a24 86%);box-shadow:0 0 60px rgba(140,232,198,.5),0 0 0 2px rgba(236,199,126,.5),inset 0 0 30px rgba(255,255,255,.2);position:relative;animation:breathe 6s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(236,199,126,.55);animation:spin 40s linear infinite}
.orb::after{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(140,232,198,.22),transparent 65%);z-index:-1}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
.tap{margin-top:24px;display:inline-flex;align-items:center;gap:8px;font-size:.64rem;letter-spacing:.24em;font-weight:800;color:#1a1206;background:linear-gradient(135deg,#ffe8b0,#ecc77e 55%,#e0b060);padding:9px 18px 9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(236,199,126,.45);animation:bob 2.4s ease-in-out infinite}
html[lang=ar] .tap{letter-spacing:0;font-size:.84rem}
.tap::before{content:"";width:9px;height:9px;border-left:2px solid #1a1206;border-top:2px solid #1a1206;transform:rotate(45deg) translate(2px,2px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.glabel{position:absolute;top:0;font-size:.62rem;letter-spacing:.3em;color:#9af4d8;font-weight:700}
html[lang=ar] .glabel{letter-spacing:0;font-size:.82rem}
.doors{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:820px;margin:0 auto}
.door[style*="236,199,126"]{flex:0 0 100%;flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;padding:11px 16px;text-align:start}
.door[style*="236,199,126"] .dg{width:46px;height:46px;flex:none}
.door[style*="236,199,126"] b,.door[style*="236,199,126"] small{text-align:start}
.door{flex:0 0 180px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 6px 11px;border-radius:20px;border:1px solid rgba(var(--cr),.32);background:linear-gradient(165deg,rgba(var(--cr),.26),rgba(var(--cr),.07) 48%,rgba(8,6,12,.82) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 26px rgba(0,0,0,.35);transition:transform .2s,border-color .2s;text-align:center}
.door:hover{transform:translateY(-3px);border-color:rgba(var(--cr),.8)}
.dg{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(var(--cr),.55),rgba(var(--cr),.12) 72%);border:1px solid rgba(var(--cr),.55);box-shadow:0 0 16px rgba(var(--cr),.3)}
.dg svg{width:24px;height:24px;fill:none;stroke:#fff9f0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(var(--cr),.7))}
.door b{font-size:.72rem;letter-spacing:.14em;text-indent:.14em;font-weight:600;color:#fff8f0}
html[lang=ar] .door b{letter-spacing:0;text-indent:0;font-size:.86rem}
.door small{font-size:.66rem;color:var(--faint);font-style:italic;font-family:var(--serif)}
/* cards: stories, cave */
.grid{display:grid;gap:12px}
.grid.st{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid.cv{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{position:relative;display:block;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .25s,border-color .25s;color:#fff}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.card.st img{aspect-ratio:150/204;object-fit:cover;width:100%}
.card.st .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 12px 12px;background:linear-gradient(180deg,transparent,rgba(6,4,10,.9) 60%)}
.card .cap b{display:block;font-family:var(--serif);font-weight:400;font-size:1.05rem;line-height:1.15}
html[lang=ar] .card .cap b{font-family:'Noto Naskh Arabic','Geeza Pro',serif;line-height:1.4}
.card .cap small{display:block;font-size:.7rem;color:var(--mist);margin-top:3px}
.card.cv .pic{display:block;position:relative;aspect-ratio:16/10;overflow:hidden}
.card.cv .pic svg{position:absolute;inset:0;width:100%;height:100%}
.card.cv .num{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .8rem/1 var(--sans);color:#0b0a12;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 60%);box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent)}
html[lang=ar] .card.cv .num{left:auto;right:8px}
.card.cv .cap{padding:10px 12px 12px}
/* godly */
.nodes{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 30px}
.node{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.node svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node i{font-style:normal}
.jewels{display:flex;flex-wrap:wrap;gap:14px 6px;justify-content:center}
.jewel{display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;text-align:center;font-size:.66rem;color:rgba(255,255,255,.86);transition:transform .2s}
.jewel:hover{transform:translateY(-3px)}
.jo{width:60px;height:60px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 34%,#1a1222),#0b0812 74%);border:1px solid color-mix(in srgb,var(--c) 62%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--c) 32%,transparent)}
.jo svg{position:absolute;inset:9%;width:82%;height:82%}
/* guides portals */
.portals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.portal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 6px;animation:float 7s ease-in-out infinite}
.portal:nth-child(2){animation-delay:-1.2s}.portal:nth-child(3){animation-delay:-2.4s}.portal:nth-child(4){animation-delay:-3.6s}.portal:nth-child(5){animation-delay:-4.8s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
.portal.now{grid-column:1/-1;order:-1;animation-duration:9s}
.pm{position:relative;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 36%,color-mix(in srgb,currentColor 30%,#0b0a12),#07060c 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 50%,transparent),inset 0 -18px 40px color-mix(in srgb,currentColor 16%,transparent),0 0 50px color-mix(in srgb,currentColor 26%,transparent)}
.portal.now .pm{width:200px;height:200px}
.pm::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40%,color-mix(in srgb,currentColor 85%,#fff) 50%,transparent 60% 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));animation:spin 9s linear infinite}
.portal.now .pm::before{inset:-11px;background:conic-gradient(from 0deg,transparent 0 30%,#ecc77e 50%,transparent 70% 100%)}
.pm::after{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,currentColor 30%,transparent),transparent 62%);z-index:-1;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.pm-in{width:76%;height:76%;display:grid;place-items:center}
.pm-in svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px color-mix(in srgb,currentColor 70%,transparent))}
.pm-in .rim,.pm-in .ear,.pm-in .wrap,.pm-in .staff{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pm-in .rim{fill:rgba(0,0,0,.35)}.pm-in .ember{fill:currentColor}
.portal b{font-size:.74rem;letter-spacing:.3em;text-indent:.3em;font-weight:600;margin-top:8px;color:currentColor;text-shadow:0 0 14px color-mix(in srgb,currentColor 50%,transparent)}
html[lang=ar] .portal b{letter-spacing:0;text-indent:0;font-size:.95rem}
.portal i{font-family:var(--serif);font-style:italic;color:rgba(240,244,242,.9);font-size:.95rem;max-width:24ch}
.portal.now i{font-size:1.25rem;max-width:34ch}
.portal .nowtag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:.52rem;letter-spacing:.22em;padding:4px 10px;border-radius:999px;background:#ecc77e;color:#1a1206;font-weight:800;white-space:nowrap}
html[lang=ar] .portal .nowtag{letter-spacing:0;font-size:.7rem}
/* music tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:170px;padding:84px 14px 14px;border-radius:22px;overflow:hidden;border:1px solid rgba(var(--cr),.38);background:radial-gradient(120% 90% at 86% 12%,rgba(var(--cr),.46),rgba(var(--cr),.1) 46%,rgba(8,6,10,.92) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.35);transition:transform .25s,border-color .25s;color:#fff}
.tile:hover{transform:translateY(-3px);border-color:rgba(var(--cr),.8)}
.tile .ic{position:absolute;left:12px;top:12px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(var(--cr),.6),rgba(var(--cr),.12) 72%);border:1px solid rgba(var(--cr),.6);box-shadow:0 0 24px rgba(var(--cr),.4)}
html[lang=ar] .tile .ic{left:auto;right:12px}
.tile .ic svg{width:34px;height:34px;fill:none;stroke:#fff8ee;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(var(--cr),.9))}
.tile b{font-family:var(--serif);font-weight:400;font-size:1.3rem;line-height:1.1}
html[lang=ar] .tile b{font-family:'Noto Naskh Arabic','Geeza Pro',serif;line-height:1.4}
.tile span{font-size:.78rem;color:rgba(255,240,224,.72);margin-top:3px}
.world{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:18px}
.world img{aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
/* 21 nights */
.lanterns{display:grid;grid-template-columns:repeat(11,1fr);gap:7px 4px;max-width:420px;margin-top:4px}
.lanterns i{display:block;aspect-ratio:64/100}
.lanterns svg{width:100%;height:100%;display:block;overflow:visible}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:30px}
.track{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:5px;align-items:center;padding:14px 16px;border-radius:20px;border:1px solid rgba(var(--cr),.34);background:linear-gradient(140deg,rgba(var(--cr),.2),rgba(10,8,14,.84) 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 28px rgba(0,0,0,.34);transition:transform .22s,border-color .22s}
.track:hover{transform:translateY(-3px);border-color:rgba(var(--cr),.75)}
.tsym{grid-row:1/3;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;color:var(--c);background:radial-gradient(circle at 50% 36%,rgba(var(--cr),.4),rgba(var(--cr),.08) 72%);border:1px solid rgba(var(--cr),.5);box-shadow:0 0 18px rgba(var(--cr),.28)}
.track b{font-family:var(--serif);font-weight:400;font-size:1.18rem;color:#fff8f0;line-height:1.15}
html[lang=ar] .track b{font-family:'Noto Naskh Arabic','Geeza Pro',serif;font-size:1.06rem;line-height:1.45}
.track span{font-size:.8rem;color:rgba(220,234,228,.7);line-height:1.35;grid-column:2}
.n21line{margin:22px auto 0;max-width:62ch;text-align:center;color:var(--mist);font-size:.92rem}
/* talk + tone */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{position:relative;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));padding:26px;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.panel .shot{width:150px;border-radius:18px;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.panel .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.panel .chips span{padding:6px 12px;border-radius:999px;border:1px solid rgba(236,199,126,.3);background:rgba(236,199,126,.06);font-size:.74rem}
.mark{width:64px;height:64px;margin-bottom:8px}
.mark svg{width:100%;height:100%;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round}
.mark circle{fill:var(--gold);stroke:none}
/* privacy + footer */
.priv{text-align:center;max-width:60ch;margin:0 auto;padding:30px 0 10px}
footer{border-top:1px solid var(--line);padding:30px 0 60px;color:var(--faint);font-size:.8rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
footer .sp{flex:1}
footer a{color:var(--mist)}
/* responsive */
@media (max-width:900px){
  .door{flex:0 0 calc(33.333% - 7px)}
  .hero{grid-template-columns:1fr;gap:20px}.phones{height:clamp(380px,100vw,520px)}.phone{width:clamp(150px,36vw,220px)}
  .stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}
  .grid.st{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .portals{grid-template-columns:repeat(2,minmax(0,1fr))}.tracks{grid-template-columns:1fr}.lanterns{grid-template-columns:repeat(11,1fr);max-width:none}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.world{grid-template-columns:repeat(4,1fr)}
  .pair{grid-template-columns:1fr}.panel{grid-template-columns:1fr}.panel .shot{width:140px;justify-self:center}
  .nav .wrap{height:58px}.btn{padding:10px 14px;font-size:.76rem}
}
@media (max-width:520px){ .phones{height:clamp(440px,118vw,560px)} .grid.st{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:8px}.stats{grid-template-columns:repeat(4,1fr)}.stat b{font-size:1.6rem}.door{flex-basis:calc(33.333% - 7px);min-height:104px} .pm{width:96px;height:96px}.portal.now .pm{width:170px;height:170px} }
@media (prefers-reduced-motion:reduce){ .orb,.orb::before,.tap,.portal,.pm::before,.pm::after{animation:none} }
</style>
</head>
<body>
<div class="sky"></div><canvas class="stars" id="stars"></canvas>
<nav class="nav"><div class="wrap">
  <a class="brand" href="#top">INNER<br>SPACE<small>المساحة الداخلية</small></a>
  <span class="sp"></span>
  <span class="lang"><button type="button" data-lang="en" class="on">English</button><button type="button" data-lang="ar">العربية</button></span>
  <a class="btn" href="inner-space.html" data-k="nav-open"></a>
</div></nav>

<main class="wrap" id="top">
 <section class="hero">
  <div>
   <div class="k" data-k="hero-k"></div>

const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
let lang=(location.hash==='#ar'||/^ar/.test(navigator.language)&&localStorage.getItem('is-site-lang')!=='en')?'ar':'en';
try{ lang=localStorage.getItem('is-site-lang')||lang; }catch(e){}
const TONE={en:['Relax','Focus','Let go','Sleep','Body'],ar:['استرخاء','تركيز','تخلٍّ','نوم','جسد']};
function paint(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $$('[data-k]').forEach(e=>{ const t=DATA.T[e.dataset.k]; if(t) e.textContent=t[lang]; });
  $$('[data-s]').forEach(e=>{ const [id,f]=e.dataset.s.split(':'); const s=DATA.stories[id]; if(s) e.textContent=s[f][lang]; });
  $$('[data-c]').forEach(e=>{ const [i,f]=e.dataset.c.split(':'); const r=DATA.cave[lang][+i]; if(r) e.textContent=f==='name'?r[0]:r[1]; });
  $$('[data-g]').forEach(e=>{ const [i,f]=e.dataset.g.split(':'); const r=DATA.guides[lang][+i]; if(r) e.textContent=f==='name'?r[0]:r[1]; });
  $$('[data-m]').forEach(e=>{ const [i,f]=e.dataset.m.split(':'); const r=DATA.music[lang][+i]; if(r) e.textContent=f==='name'?r[0]:r[1]; });
  $$('[data-d]').forEach(e=>{ const [i]=e.dataset.d.split(':'); e.textContent=DATA.dock[lang][+i]||''; });
  $$('[data-dr]').forEach(e=>{ const [id,i]=e.dataset.dr.split(':'); e.textContent=DATA.doors[id][lang][+i]; });
  $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  const tc=$('#tonechips'); if(tc) tc.innerHTML=TONE[lang].map(x=>'<span>'+x+'</span>').join('');
  const ph=$('[data-shot-home] img'); if(ph) ph.src=lang==='ar'?SHOT_HOME_AR:SHOT_HOME;
  $$('.portal').forEach(p=>{ let t=p.querySelector('.nowtag'); if(p.classList.contains('now')){ if(!t){ t=document.createElement('span'); t.className='nowtag'; p.querySelector('.pm').appendChild(t); } t.textContent=DATA.T.now[lang]; } });
}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{ lang=b.dataset.lang; try{ localStorage.setItem('is-site-lang',lang); }catch(e){} paint(); }));
paint();
/* stars */
(()=>{ const c=$('#stars'); const x=c.getContext('2d'); let W,H,S=[]; const R=()=>Math.random();
  const size=()=>{ W=c.width=innerWidth; H=c.height=innerHeight; S=[]; for(let i=0;i<Math.min(260,W*H/6000);i++) S.push({x:R()*W,y:R()*H,r:.4+R()*1.2,o:.2+R()*.7,t:R()*6.28}); };
  size(); addEventListener('resize',size);
  const draw=t=>{ x.clearRect(0,0,W,H); for(const s of S){ const o=s.o*(0.6+0.4*Math.sin(t/1400+s.t)); x.globalAlpha=o; x.fillStyle='#fff'; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); } x.globalAlpha=1; if(!matchMedia('(prefers-reduced-motion:reduce)').matches) requestAnimationFrame(draw); };
  requestAnimationFrame(draw); })();
</script>
